name: Standalone C# core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified when added
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4, verified when added
        with:
          dotnet-version: '10.0.404'
      - name: Data, core checks and three rule simulations
        run: python3 tools/check_all.py
      - name: Concrete regression mutations
        run: python3 tools/check_mutations.py
